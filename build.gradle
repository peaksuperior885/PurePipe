plugins {
    id 'java'
    id 'maven-publish'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'dev.peak885.purepipe'
version = '1.0.0'

repositories {
    mavenCentral()
    maven {
        url 'https://jitpack.io'
    }
    flatDir {
        dirs 'libs'
    }
}

configurations {
    bundle
}

dependencies {
    // |=========================|
    // |   Bundled + relocated   |
    // |=========================|

    bundle 'com.github.teamnewpipe:newpipeextractor:v0.26.5'
    bundle 'com.squareup.okhttp3:okhttp:4.12.0'
    bundle 'com.github.Walkyst:JAADec-fork:0.1.3'
    bundle 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    // |=========================|
    // |   Compile-time only     |
    // |=========================|

    compileOnly 'com.github.teamnewpipe:newpipeextractor:v0.26.5'
    compileOnly 'com.squareup.okhttp3:okhttp:4.12.0'
    compileOnly 'com.github.Walkyst:JAADec-fork:0.1.3'
    compileOnly 'com.github.ben-manes.caffeine:caffeine:3.2.4'

    compileOnly 'org.jetbrains.kotlin:kotlin-stdlib:1.9.22'

    implementation 'org.tinylog:tinylog-api:2.7.0'
    implementation 'org.tinylog:tinylog-impl:2.7.0'

    compileOnly 'org.jetbrains:annotations:26.0.2'

    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
}

jar.enabled=false

tasks.shadowJar {
    archiveClassifier.set('')

    configurations = [project.configurations.bundle]

    // |=========================|
    // |       Relocations       |
    // |=========================|

    relocate 'org.schabi.newpipe',
            'dev.peak885.purepipe.internal.newpipe'

    relocate 'okhttp3',
            'dev.peak885.purepipe.internal.okhttp3'

    relocate 'okio',
            'dev.peak885.purepipe.internal.okio'

    relocate 'net.sourceforge.jaad',
            'dev.peak885.purepipe.internal.jaad'

    relocate 'com.grack.nanojson',
            'dev.peak885.purepipe.internal.newpipe.nanojson'

    relocate 'org.jsoup',
            'dev.peak885.purepipe.internal.newpipe.jsoup'

    relocate 'org.jspecify',
            'dev.peak885.purepipe.internal.jspecify'

    relocate 'org.mozilla.javascript',
            'dev.peak885.purepipe.internal.newpipe.javascript'

    relocate 'org.mozilla.classfile',
            'dev.peak885.purepipe.internal.newpipe.javascript.classfile'

    relocate 'com.google',
            'dev.peak885.purepipe.internal.google'

    relocate 'com.github.benmanes.caffeine',
            'dev.peak885.purepipe.internal.caffeine'

    // |====================================================================|
    // |  Don't bundle Kotlin or else there is something wrong with you :)  |
    // |====================================================================|

    exclude 'META-INF/versions/**'
    exclude 'META-INF/kotlin*'
    exclude 'kotlin/**'
    exclude 'kotlinx/**'
    exclude 'org/jetbrains/annotations/**'
    exclude 'org/intellij/**'
    exclude 'javax/**'

    manifest {
        attributes(
                'Implementation-Title': 'PurePipe Audio',
                'Implementation-Version': project.version
        )
    }
}

tasks.build.dependsOn tasks.shadowJar

// |============================================================|
// |                   Maven publication                        |
// |============================================================|

publishing {
    publications {
        maven(MavenPublication) {
            groupId = project.group
            artifactId = 'purepipe-audio'
            version = project.version

            artifact(tasks.shadowJar)

            pom {
                name = 'PurePipe Audio'
                description = 'Pure Java audio streaming and decoding API'
            }
        }
    }
    repositories {
        maven {
            name = "GitHub"
            url = layout.projectDirectory.dir("peaks_maven")
        }
    }
}

tasks.named('generatePomFileForMavenPublication') {
    dependsOn tasks.shadowJar
}

test {
    useJUnitPlatform()
}